services:
  postgres:
    image: postgres:16-alpine
    container_name: rideflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideflow}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/ddl/01_schemas.sql:/docker-entrypoint-initdb.d/01_schemas.sql:ro
      - ./sql/ddl/02_raw_tables.sql:/docker-entrypoint-initdb.d/02_raw_tables.sql:ro
      - ./sql/ddl/03_audit_monitoring.sql:/docker-entrypoint-initdb.d/03_audit_monitoring.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rideflow} -d ${POSTGRES_DB:-rideflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build: .
    container_name: rideflow-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-rideflow}:${POSTGRES_PASSWORD:-rideflow_secret}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rideflow}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secret}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        psql postgresql://${POSTGRES_USER:-rideflow}:${POSTGRES_PASSWORD:-rideflow_secret}@postgres:5432/postgres -tc "SELECT 1 FROM pg_database WHERE datname='airflow'" | grep -q 1 || \
        psql postgresql://${POSTGRES_USER:-rideflow}:${POSTGRES_PASSWORD:-rideflow_secret}@postgres:5432/postgres -c "CREATE DATABASE airflow;"
        airflow db migrate
        airflow users create --username admin --password admin --firstname Ride --lastname Flow --role Admin --email admin@rideflow.local || true
    restart: "no"

  airflow-webserver:
    build: .
    container_name: rideflow-airflow-web
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-rideflow}:${POSTGRES_PASSWORD:-rideflow_secret}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rideflow}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secret}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./dbt:/opt/airflow/dbt
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./requirements.txt:/opt/airflow/requirements.txt
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build: .
    container_name: rideflow-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-rideflow}:${POSTGRES_PASSWORD:-rideflow_secret}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rideflow}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secret}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./dbt:/opt/airflow/dbt
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
    command: scheduler

volumes:
  postgres_data:
